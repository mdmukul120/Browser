name: Build & Release DevChrome Browser

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create debug.keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle Wrapper JAR exists
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -L -s -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar || \
            curl -L -s -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -l gradle/wrapper/gradle-wrapper.jar

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Run Unit Tests
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon
          else
            gradle :app:testDebugUnitTest --no-daemon
          fi

      - name: Build Android APK (Debug & Release)
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
          else
            gradle :app:assembleDebug :app:assembleRelease --no-daemon
          fi

      - name: Build Android App Bundle (AAB)
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:bundleRelease --no-daemon || true
          else
            gradle :app:bundleRelease --no-daemon || true
          fi

      - name: Locate Output Artifacts
        id: locate_artifacts
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} release-artifacts/ \;
          find app/build/outputs/bundle -name "*.aab" -exec cp {} release-artifacts/ \; || true
          ls -la release-artifacts/

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devchrome-browser-binaries
          path: release-artifacts/*

      - name: Determine Release Tag
        id: tag_name
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v1.1.0-build-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: "DevChrome Browser ${{ steps.tag_name.outputs.TAG }}"
          body: |
            ## 🚀 DevChrome Browser - Update v1.1.0
            
            Automatic build generated by GitHub Actions.
            
            ### ✨ Features Included:
            - **F12 Developer Tools (Console Terminal)**: Real-time interactive JavaScript REPL (`>`), `console.log/warn/error` inspector.
            - **DOM Elements Inspector**: Interactive on-page element touch highlighter with computed styles & attributes.
            - **Network Inspector**: Full HTTP/Fetch/XHR request interceptor with status codes, timings, and previews.
            - **Storage & Performance**: LocalStorage, Cookies, and Navigation Timing API audit with Lighthouse scoring.
            - **Ad & Tracker Blocker**: Built-in filter lists blocking popups, banner ads, and tracking scripts.
            - **User-Friendly Dark Mode**: Chrome deep dark theme + Web Force Dark Mode inversion filter.
            - **Full Website Offline Downloader**: Multi-page recursive crawler archiving entire websites (HTML, CSS, JS, images) for 100% offline navigation.
            - **Multi-Tab & Incognito**: Card switcher grid and tab manager.
            
            ### 📥 Download:
            Download the attached `app-debug.apk` or `app-release.apk` below and install on any Android 7.0+ device!
          files: release-artifacts/*
          draft: false
          prerelease: false
